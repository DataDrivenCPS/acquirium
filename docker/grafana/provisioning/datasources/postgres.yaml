apiVersion: 1

datasources:
  - name: Acquirium Postgres
    uid: acquirium-postgres
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: ${POSTGRES_USER}
    isDefault: true
    editable: true
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
