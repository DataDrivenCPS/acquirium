# ===========================================================================
# 5b) seawater-ro-fouled self-driving simulation.
#    Same flowsheet as seawater-ro, but generate-values.py also drives
#    RO.A_comp down a slow exponential fouling trajectory each tick, so
#    permeate output visibly degrades over time. Own namespace
#    (urn:swro-fouled/), so it can run alongside the healthy seawater-ro
#    model without colliding ontology points.
# ===========================================================================
# [[drivers]]
# spec                        = "simulation_driver.py:SimulationDriver"
# interval                    = 10.0
# source_id          = "watertap-seawater-ro-fouled"
# watertap_mapping_path       = "deployments/WATERTAP/models/seawater-ro-fouled/watertap-mapping.json"
# watertap_graph_path         = "deployments/WATERTAP/models/seawater-ro-fouled/model.ttl"
# watertap_insert_graph       = true
# watertap_build_spec         = "deployments/WATERTAP/models/seawater-ro-fouled/build-and-solve.py:build"
# watertap_change_inputs_spec = "deployments/WATERTAP/models/seawater-ro-fouled/build-and-solve.py:change_inputs"
# watertap_solve_spec         = "deployments/WATERTAP/models/seawater-ro-fouled/build-and-solve.py:solve"
# watertap_generate_spec      = "deployments/WATERTAP/models/seawater-ro-fouled/generate-values.py:generate_new_values"
# watertap_seed               = 42

# ===========================================================================
# 5) Parquet ingest, WaterTAP-aware (seawater-ro).
#    Replays data-generator snapshots and links each column to its ontology
#    point (via watertap-mapping.json), so meaning-first queries reach the data.
#    watch_dir is relative to THIS config file's directory; the watertap_* paths
#    are relative to the current working directory (the repo root).
# ===========================================================================
# [[drivers]]
# spec                   = "parquet_driver.py:WaterTAPParquetDriver"
# interval               = 5.0
# watch_dir              = "../models/seawater-ro/data"
# glob                   = ["*.parquet", "*.pq"]
# format                 = "wide"
# time_col               = "timestamp"
# source_id     = "watertap-seawater-ro"
# watertap_mapping_path  = "deployments/WATERTAP/models/seawater-ro/watertap-mapping.json"
# watertap_graph_path    = "deployments/WATERTAP/models/seawater-ro/model.ttl"
# watertap_insert_graph  = true

# ===========================================================================
# 6) Parquet ingest, WaterTAP-aware (simple-pipe).
# ===========================================================================
# [[drivers]]
# spec                   = "parquet_driver.py:WaterTAPParquetDriver"
# interval               = 5.0
# watch_dir              = "../models/simple-pipe/data"
# glob                   = ["*.parquet", "*.pq"]
# format                 = "wide"
# time_col               = "timestamp"
# source_id     = "watertap-simple-pipe"
# watertap_mapping_path  = "deployments/WATERTAP/models/simple-pipe/watertap-mapping.json"
# watertap_graph_path    = "deployments/WATERTAP/models/simple-pipe/model.ttl"
# watertap_insert_graph  = true


# ===========================================================================
# 7) Parquet ingest, WaterTAP-aware (seawater-ro-fouled).
#    Own namespace (urn:swro-fouled/, prefix wbsf:) so it ingests alongside
#    the healthy seawater-ro model below without colliding ontology points.
#    Used by notebooks/watertap/soft-sensor.ipynb (clean-vs-fouled anomaly demo).
# ===========================================================================
[[drivers]]
spec                   = "parquet_driver.py:WaterTAPParquetDriver"
interval               = 5.0
watch_dir              = "../models/seawater-ro-fouled/data"
glob                   = ["*.parquet", "*.pq"]
format                 = "wide"
time_col               = "timestamp"
source_id     = "watertap-seawater-ro-fouled"
watertap_mapping_path  = "deployments/WATERTAP/models/seawater-ro-fouled/watertap-mapping.json"
watertap_graph_path    = "deployments/WATERTAP/models/seawater-ro-fouled/model.ttl"
watertap_insert_graph  = true

# ===========================================================================
# 8) seawater-ro self-driving simulation.
#    Generates fresh feed inputs every tick, solves, ingests mapped outputs.
#    (Disabled: the enabled block below replays parquet snapshots instead.
#    Both share source_id "watertap-seawater-ro", so you can enable both to
#    merge live-sim and historical parquet data onto the same points.)
# ===========================================================================
[[drivers]]
spec                        = "simulation_driver.py:SimulationDriver"
interval                    = 10.0
source_id          = "watertap-seawater-ro"
watertap_mapping_path       = "deployments/WATERTAP/models/seawater-ro/watertap-mapping.json"
watertap_graph_path         = "deployments/WATERTAP/models/seawater-ro/model.ttl"
watertap_insert_graph       = true
watertap_build_spec         = "deployments/WATERTAP/models/seawater-ro/build-and-solve.py:build"
watertap_change_inputs_spec = "deployments/WATERTAP/models/seawater-ro/build-and-solve.py:change_inputs"
watertap_solve_spec         = "deployments/WATERTAP/models/seawater-ro/build-and-solve.py:solve"
watertap_generate_spec      = "deployments/WATERTAP/models/seawater-ro/generate-values.py:generate_new_values"
watertap_seed               = 42
