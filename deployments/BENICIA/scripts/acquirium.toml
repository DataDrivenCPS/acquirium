# Acquirium config for the Benicia deployment.
#
# Boot the server (data + both drivers) from the REPO ROOT:
#   acquirium server --config deployments/BENICIA/scripts/acquirium.toml
#
# This starts the HTTP server with its data directory inside this deployment
# (deployments/BENICIA/data) and launches two drivers as Ray actors:
#   1. BeniciaSimulatorDriver  — live self-driving simulation (generates a value
#      per model property each tick and pushes it to Acquirium).
#   2. BeniciaParquetDriver    — replays the historical wide parquet generated by
#      scripts/generate_historical.py.
# Both link every stream to its model point (urn:ex/<name>), so the live and
# historical data land on the same ontology points.
#
# Path bases:
#   * [server] data_dir, driver `model`, and parquet `watch_dir` resolve
#     relative to THIS config file's directory (deployments/BENICIA/scripts).
#   * driver `spec` file paths also resolve relative to this directory.
#
# Generate the historical parquet first (from the repo root):
#   python deployments/BENICIA/scripts/generate_historical.py

[server]
enabled           = true          # start the HTTP server in-process
data_dir          = "../.acquirium"        # -> deployments/BENICIA/.acquirium (duckdb, apps, graph)
timeseries_backend = "duckdb"

[driver]
server_url  = "localhost"
server_port = 8000
interval    = 1.0

# ===========================================================================
# 1) Live self-driving simulation.
#    Generates a fresh value per property each tick and pushes to Acquirium.
# ===========================================================================
[[drivers]]
spec           = "simulator_driver.py:BeniciaSimulatorDriver"
interval       = 1.0
model          = "../benicia-model-100.ttl"
source_id      = "benicia-live"
namespace      = "urn:ex/"
insert_graph   = true
seed           = 42
excursion_rate = 0.02
step_frac      = 0.02

# ===========================================================================
# 2) Historical parquet replay.
#    Replays deployments/BENICIA/data/historical/*.parquet onto the model points.
# ===========================================================================
[[drivers]]
spec         = "parquet_driver.py:BeniciaParquetDriver"
interval     = 5.0
watch_dir    = "../data/historical"
format       = "wide"
time_col     = "timestamp"
source_id    = "benicia-historical"
model        = "../benicia-model-100.ttl"
insert_graph = true
