services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: acquirium_test_mosquitto
    ports:
    - 11883:1883
    volumes:
    - mosquitto_test_data:/mosquitto/data
    - mosquitto_test_log:/mosquitto/log
    - ./src/acquirium/internals/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
    - acquirium_net
    healthcheck:
      test:
      - CMD-SHELL
      - mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 >/dev/null
        2>&1
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
    - server
  acquirium:
    build:
      context: .
      dockerfile: ./src/acquirium/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
      ssh:
      - default
    container_name: acquirium_test_server
    volumes:
    - acquirium_test_data:/app/.acquirium
    - ./acquirium.testing.toml:/app/acquirium.toml:ro
    ports:
    - 8010:8000
    environment:
      ACQUIRIUM_DATA_DIR: /app/.acquirium
      FASTEMBED_CACHE_PATH: /app/.fastembed_cache
      ACQUIRIUM_RECREATE: 'true'
      ACQUIRIUM_APP_NETWORK: acquirium_test_acquirium_net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - acquirium_net
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 5s
      timeout: 2s
      retries: 120
      start_period: 180s
    profiles:
    - server
volumes:
  mosquitto_test_data:
    name: acquirium_mosquitto_test_data
  mosquitto_test_log:
    name: acquirium_mosquitto_test_log
  acquirium_test_data:
    name: acquirium_acquirium_test_data
networks:
  acquirium_net:
    name: acquirium_test_acquirium_net
