[project]
name = "acquirium"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabe Fierro", email = "gtfierro@mines.edu" },
    { name = "Mete Saka", email = "saka@mines.edu"}
]
requires-python = ">=3.12"

dependencies = [
    "adbc-driver-postgresql>=1.9.0",
    "docker>=7.1.0",
    "duckdb>=0.10.0",
    "typer>=0.12.0",
    "fastembed>=0.4.0",
    "fastapi>=0.125.0",
    "fastexcel>=0.17.2",
    "grafanalib>=0.7.1",
    "ipykernel==7.0.1",
    "matplotlib>=3.10.8",
    "numpy==2.3.5",
    "polars>=1.36.1",
    "psycopg[binary]>=3.3.1",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "pyontoenv==0.5.4",
    "pyoxigraph>=0.5.2",
    "pytest>=9.0.2",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
# these provide support for different drivers, which
# often require external dependencies.
mqtt = [
    "paho-mqtt>=2.1.0",
]
xlsx = [
    "fastexcel>=0.11.0",
]
watertap = [
    "pyomo>=6",
    "watertap",
]


[project.scripts]
acquirium = "acquirium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "openpyxl>=3.1.5",
    "q>=2.7",
    "pytest-cov>=6.0",
    "openpyxl>=3.1",
]
no-build-isolation-package = ["pygit2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external services required)",
    "integration: Integration tests (require Docker services)",
]
