[project]
name = "acquirium"
version = "0.4.0a0"
description = "Acquirium: A data-metadata management platform for water treatment systems"
readme = "README.md"
authors = [
    { name = "Gabe Fierro", email = "gtfierro@mines.edu" },
    { name = "Mete Saka", email = "saka@mines.edu"}
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "water-treatment",
    "metadata",
    "knowledge-graph",
    "ontology",
    "time-series",
    "rdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "adbc-driver-postgresql>=1.9.0",
    "duckdb>=0.10.0",
    "typer>=0.12.0",
    "fastembed>=0.4.0",
    "fastapi>=0.125.0",
    "fastexcel>=0.17.2",
    "grafanalib>=0.7.1",
    "ipykernel==7.0.1",
    "matplotlib>=3.10.8",
    "numpy==2.3.5",
    "polars>=1.36.1",
    "psycopg[binary]>=3.3.1",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "pyontoenv==0.6.0",
    "pyoxigraph>=0.5.2",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "uvicorn>=0.38.0",
    "ray>=2.56.0",
]

[project.optional-dependencies]
# these provide support for different drivers, which
# often require external dependencies.
mqtt = [
    "paho-mqtt>=2.1.0",
]
xlsx = [
    "fastexcel>=0.11.0",
]
watertap = [
    "pyomo>=6",
    "watertap",
    "streamlit",
]


[project.scripts]
acquirium = "acquirium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship bundled ontology TTL files inside the wheel/sdist so
# `importlib.resources.files("acquirium._ontologies")` works after
# `pip install acquirium` — no reliance on a sibling `ontologies/` dir.
# The `_ontologies` package (and its .ttl data) ships automatically as
# part of `packages`; do NOT also `force-include` it or every file ends
# up twice in the wheel ("Duplicate filename in local headers" on upload).
[tool.hatch.build.targets.wheel]
packages = ["src/acquirium"]

[tool.hatch.build.targets.sdist]
include = [
    "src/acquirium/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "q>=2.7",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
]

[tool.uv]
no-build-isolation-package = ["pygit2"]
# fastembed pulls in py-rust-stemmers transitively. Versions <0.1.7 ship no
# cp314 wheel, so on Python 3.14 uv would compile it from a Rust sdist — which
# fails in the slim server image (no C toolchain). 0.1.7+ ships cp314 wheels
# and stays within fastembed's <0.2.0 range, keeping installs wheel-only.
constraint-dependencies = ["py-rust-stemmers>=0.1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external services required)",
    "integration: Integration tests (require Docker services)",
]
