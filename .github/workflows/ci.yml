name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # Every page must be listed in docs/_toc.yml, or it won't show up in the
      # site navigation at watermetadata.org/acquirium.
      - name: Build docs and check table of contents
        run: |
          uv run --locked --only-group docs jupyter-book build docs 2>&1 | tee docs-build.log
          if grep "isn't included in any toctree" docs-build.log; then
            echo "::error::Add the pages above to docs/_toc.yml"
            exit 1
          fi

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Pin every uv invocation to the matrix interpreter, overriding the repo's
    # .python-version (3.12). Without this, `uv run` re-resolves to 3.12 and
    # recreates the venv, so the tests never actually run on the matrix version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked --extra mqtt

      - name: Run unit tests with coverage
        run: |
          uv run --no-sync pytest tests/unit/ \
            -v \
            --tb=short \
            --junitxml=junit-results.xml \
            --cov=acquirium \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: |
            junit-results.xml
            coverage.xml

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: unit-tests

    # PostgreSQL variants of the experiment ledger and engine tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: acquirium
          POSTGRES_PASSWORD: acquirium
          POSTGRES_DB: acquirium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acquirium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked --extra mqtt

      # A service container cannot take a command, and Mosquitto 2's default
      # configuration accepts only local connections.
      - name: Start Mosquitto
        run: docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf

      - name: Run integration tests
        env:
          ACQUIRIUM_TEST_PG_DSN: postgresql://acquirium:acquirium@localhost:5432/acquirium_test
          ACQUIRIUM_TEST_MQTT: localhost:1883
        run: |
          uv run --no-sync pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/unit \
            --junitxml=junit-integration.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results-py${{ matrix.python-version }}
          path: |
            junit-integration.xml
