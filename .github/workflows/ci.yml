name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Pin every uv invocation to the matrix interpreter, overriding the repo's
    # .python-version (3.12). Without this, `uv run` re-resolves to 3.12 and
    # recreates the venv, so the tests never actually run on the matrix version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked

      - name: Run unit tests with coverage
        run: |
          uv run --no-sync pytest tests/unit/ \
            -v \
            --tb=short \
            --junitxml=junit-results.xml \
            --cov=acquirium \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: |
            junit-results.xml
            coverage.xml

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: unit-tests

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked

      - name: Check Docker Compose
        run: docker compose version

      - name: Start services
        run: make testing-up
        env:
          ACQUIRIUM_RECREATE: "true"
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Wait for server health
        run: make wait-health ACQUIRIUM_PORT=8010

      - name: Run integration tests
        env:
          ACQUIRIUM_TEST_SERVER_HOST: localhost
          ACQUIRIUM_TEST_SERVER_PORT: "8010"
          ACQUIRIUM_TEST_PG_DSN: postgresql://acquirium:acquirium@localhost:55432/acquirium_test
        run: |
          uv run --no-sync pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/unit \
            --junitxml=junit-integration.xml

      - name: Collect service logs
        if: failure()
        run: COMPOSE_PROJECT_NAME=acquirium_test docker compose -f compose.testing.yaml --profile server --profile test logs --tail=200 > service-logs.txt 2>&1

      - name: Show service status
        if: failure()
        run: COMPOSE_PROJECT_NAME=acquirium_test docker compose -f compose.testing.yaml --profile server --profile test ps

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results-py${{ matrix.python-version }}
          path: |
            junit-integration.xml
            service-logs.txt

      - name: Tear down
        if: always()
        run: make testing-down
