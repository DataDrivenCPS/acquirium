name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Pin every uv invocation to the matrix interpreter, overriding the repo's
    # .python-version (3.12). Without this, `uv run` re-resolves to 3.12 and
    # recreates the venv, so the tests never actually run on the matrix version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust for Escapement
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate the pinned Escapement source
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ESCAPEMENT_SSH_KEY }}

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked --extra mqtt

      - name: Run unit tests with coverage
        run: |
          uv run --no-sync pytest tests/unit/ \
            -v \
            --tb=short \
            --junitxml=junit-results.xml \
            --cov=acquirium \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: |
            junit-results.xml
            coverage.xml

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: unit-tests

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust for Escapement
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate the pinned Escapement source
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ESCAPEMENT_SSH_KEY }}

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked --extra mqtt

      - name: Run integration tests
        run: |
          uv run --no-sync pytest tests/integration/test_native_runtime.py tests/integration/test_soft_sensors.py tests/integration/test_local_runtime.py tests/integration/test_graph_store.py \
            -v \
            --tb=short \
            --ignore=tests/unit \
            --junitxml=junit-integration.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results-py${{ matrix.python-version }}
          path: |
            junit-integration.xml
