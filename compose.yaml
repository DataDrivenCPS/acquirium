version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: acquirium_timescaledb
    environment:
      POSTGRES_USER: acquirium
      POSTGRES_PASSWORD: acquirium
      POSTGRES_DB: acquirium_test
    ports:
      - "5432:5432"

    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./src/acquirium/internals/init-timescaledb.sql:/docker-entrypoint-initdb.d/init-timescaledb.sql:ro

    networks:
      - acquirium_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquirium -d acquirium_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: acquirium_mosquitto
    ports:
      - "1883:1883"   # MQTT
      # - "9001:9001" # WebSockets (optional; enable in config if you want it)
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./src/acquirium/internals/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - acquirium_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  acquirium:
    build: 
      context: .
      dockerfile: ./src/acquirium/Dockerfile
    container_name: acquirium_server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - acquirium_data:/app/.acquirium
    ports:
      - "8000:8000"
    environment:
      # Use service names as hostnames inside the docker network
      ACQUIRIUM_DATA_DIR: /app/.acquirium
      PG_DSN: "postgresql://acquirium:acquirium@timescaledb:5432/acquirium_test"
      FASTEMBED_CACHE_PATH: /app/.fastembed_cache
      ACQUIRIUM_RECREATE: ${ACQUIRIUM_RECREATE:-false}
      ACQUIRIUM_APP_NETWORK: "acquirium_acquirium_net"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - acquirium_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 20s

  watertap_sim:
    platform: linux/arm64
    build:
      context: ./deployments/WATERTAP/scripts
      dockerfile: Dockerfile
    container_name: acquirium_watertap_sim
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - watertap_simulation

  watertap_w_gui:
    platform: linux/arm64
    build:
      context: ./deployments/WATERTAP2/
      dockerfile: scripts/Dockerfile
    container_name: acquirium_watertap_w_gui
    ports:
      - "8501:8501"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - watertap_simulation
      - watertap_gui


  testing_service:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    container_name: acquirium_testing_service
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - test

  benicia_sim:
    platform: linux/arm64
    build:
      context: ./deployments/BENICIA/
      dockerfile: scripts/Dockerfile
    container_name: acquirium_benicia_sim
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - benicia_simulation




  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - TERM=linux
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel,grafana-polystat-panel
    ports:
      - '3000:3000'
    volumes:
      - 'grafana_storage:/var/lib/grafana'
    networks:
      - acquirium_net
    profiles:
      - grafana
      - watertap_gui

volumes:
  tsdb_data:
  mosquitto_data:
  mosquitto_log:
  acquirium_data:
  grafana_storage:

networks:
  acquirium_net:
