services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_timescaledb
    environment:
      POSTGRES_USER: acquirium
      POSTGRES_PASSWORD: acquirium
      POSTGRES_DB: ${POSTGRES_DB:-acquirium}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./src/acquirium/internals/init-timescaledb.sql:/docker-entrypoint-initdb.d/init-timescaledb.sql:ro

    networks:
      - acquirium_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquirium -d $${POSTGRES_DB:-acquirium}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_mosquitto
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"   # MQTT
      # - "9001:9001" # WebSockets (optional; enable in config if you want it)
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./src/acquirium/internals/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - acquirium_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - server

  acquirium:
    build: 
      context: .
      dockerfile: ./src/acquirium/Dockerfile
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - acquirium_data:/app/.acquirium
      - ./${ACQUIRIUM_CONFIG_FILE:-acquirium.toml}:/app/acquirium.toml:ro
    ports:
      - "${ACQUIRIUM_HOST_PORT:-8000}:8000"
    environment:
      # Use service names as hostnames inside the docker network
      ACQUIRIUM_DATA_DIR: /app/.acquirium
      PG_DSN: ${PG_DSN:-postgresql://acquirium:acquirium@timescaledb:5432/acquirium}
      FASTEMBED_CACHE_PATH: /app/.fastembed_cache
      ACQUIRIUM_RECREATE: ${ACQUIRIUM_RECREATE:-false}
      ACQUIRIUM_APP_NETWORK: ${ACQUIRIUM_APP_NETWORK:-acquirium_acquirium_net}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - acquirium_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 20s
    profiles:
      - server

  watertap_sim:
    platform: linux/arm64
    build:
      context: ./deployments/WATERTAP/scripts
      dockerfile: Dockerfile
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_watertap_sim
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - watertap_simulation

  watertap_w_gui:
    platform: linux/arm64
    build:
      context: ./deployments/WATERTAP2/
      dockerfile: scripts/Dockerfile
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_watertap_w_gui
    ports:
      - "8501:8501"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - watertap_simulation
      - watertap_gui


  testing_service:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_testing_service
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - test

  benicia_sim:
    platform: linux/arm64
    build:
      context: ./deployments/BENICIA/
      dockerfile: scripts/Dockerfile
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_benicia_sim
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      acquirium:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - benicia_simulation




  grafana:
    image: grafana/grafana:latest
    container_name: ${ACQUIRIUM_CONTAINER_PREFIX:-acquirium}_grafana
    restart: unless-stopped
    environment:
      - TERM=linux
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel,grafana-polystat-panel
      - POSTGRES_USER=acquirium
      - POSTGRES_PASSWORD=acquirium
      - POSTGRES_DB=${POSTGRES_DB:-acquirium}
    ports:
      - '3000:3000'
    volumes:
      - 'grafana_storage:/var/lib/grafana'
      - './docker/grafana/provisioning:/etc/grafana/provisioning:ro'
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - acquirium_net
    profiles:
      - grafana
      - no-server
      - watertap_gui

volumes:
  tsdb_data:
    name: ${TSDB_VOLUME:-acquirium_tsdb_data}
  mosquitto_data:
  mosquitto_log:
  acquirium_data:
  grafana_storage:

networks:
  acquirium_net:
