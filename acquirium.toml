# acquirium.toml — example configuration using the DuckDB timeseries backend
#
# Usage:
#   acquirium server --config acquirium.toml

[server]
# Network
host = "0.0.0.0"
port = 8000

# Data directory: Oxigraph graph store, embedding cache, and app storage
# all live under this path.
data_dir = ".acquirium"

# Use DuckDB for timeseries storage instead of TimescaleDB.
# The DuckDB file is created automatically if it does not exist.
# NOTE: the server runs as a single process (uvicorn --workers 1) on every
#       backend: the embedded Oxigraph graph store is single-process, and
#       "timescale" only moves the timeseries store out of process.
timeseries_backend = "duckdb"
duckdb_path = ".acquirium/timeseries.duckdb"

# Uncomment to use TimescaleDB instead:
# timeseries_backend = "timescale"
# pg_dsn = "postgresql://acquirium:acquirium@localhost:5432/acquirium"

# RDF graph store path (Oxigraph).  Defaults to {data_dir}/.oxigraph.
# graph_path = ".acquirium/.oxigraph"

# Embedding model for text → URI resolution.
# embedding_model = "BAAI/bge-small-en-v1.5"

# Set to true to wipe all data on server startup (useful for development).
recreate = false

# Number of rows per Arrow RecordBatch in timeseries read responses.
# read_batch_size = 50000

# Bounded transformation concurrency through the server's fixed Ray actor pool.
materialization_workers = 2

# Durable recovery polling. Values must be positive seconds.
# materialization_poll_seconds = 0.25
# materialization_safety_scan_seconds = 1.0
# materialization_error_log_seconds = 30.0

# ---------------------------------------------------------------------------
# Additional or overriding ontology sources.
#
# The acquirium package ships these ontologies bundled, registered at
# these canonical IRIs (the QUDT files are version-collapsed at load):
#   - NAWI Water           urn:nawi-water-ontology
#   - ASHRAE 223P          http://data.ashrae.org/standard223/1.0/model/all
#   - QUDT units           https://qudt.org/vocab/unit
#   - QUDT quantitykind    https://qudt.org/vocab/quantitykind
#   - Brick ref-schema     https://brickschema.org/schema/Brick/ref
#
# `sources` is a list of entries. Each entry is either:
#
#   * a plain string — load the URL/path and register it under
#     whatever IRI the file's owl:Ontology declaration uses, OR
#
#   * a `{ source = "...", as = "<canonical IRI>" }` table — load the
#     source, rewrite its declared owl:Ontology IRI to `as`, and
#     register it there (replacing any existing graph at that IRI,
#     bundled or otherwise).
#
# Relative file paths are resolved against this config file's directory.
# ---------------------------------------------------------------------------
# [ontologies]
# sources = [
#   "./local-extensions.ttl",
#   { source = "https://qudt.org/3.3.0/vocab/unit",
#     as     = "https://qudt.org/vocab/unit" },
# ]

[driver]
# Defaults applied to every [[drivers]] entry.
server_url  = "localhost"
server_port = 8000
use_ssl     = false

# Seconds between successive tick() calls.
interval = 10.0

# ---------------------------------------------------------------------------
# Default drivers — started automatically alongside `acquirium server`.
# Each [[drivers]] entry requires a 'spec' and may override any [driver] key.
# ---------------------------------------------------------------------------

# Uncomment to enable MQTT ingestion as a default driver:
# [[drivers]]
# spec                = "acquirium.Drivers.BuiltInDrivers.mqtt_ingestion:MQTTIngestDriver"
# interval            = 1.0         # how often buffered messages are inserted
# graph_poll_interval = 30.0        # how often to look for newly declared topics
# source_id           = "mqtt"      # datasource used for all MQTT streams

[[drivers]]
spec     = "acquirium.Drivers.BuiltInDrivers.system_metrics:SystemMetricsDriver"
interval = 30.0

# Watch a directory for CSV and TSV files.
# [[drivers]]
# spec         = "acquirium.Drivers.BuiltInDrivers.csv_ingest:CSVIngestDriver"
# interval     = 5.0
# source_id    = "csv-exports"
# watch_dir    = "./data"
# glob         = ["*.csv", "*.tsv"]
# format       = "wide"        # required: "wide" | "narrow"
# time_col     = "timestamp"   # optional; common names are discovered
# date_col     = "Date"        # alternative split timestamp
# clock_col    = "Time"
# id_col       = "id"          # narrow format: stream ID column
# value_col    = "value"       # narrow format: value column

# Watch a directory for Excel (XLSX) files.
# [[drivers]]
# spec         = "acquirium.Drivers.BuiltInDrivers.xlsx_ingest:XLSXIngestDriver"
# interval     = 5.0
# source_id    = "xlsx-exports"
# watch_dir    = "./data"
# glob         = "*.xlsx"
# format       = "wide"        # required: "wide" | "narrow"
# time_col     = "timestamp"   # optional; common names are discovered
# date_col     = "Date"        # alternative split timestamp
# clock_col    = "Time"
# id_col       = "id"          # narrow format: stream ID column
# value_col    = "value"       # narrow format: value column
# sheets       = ["Sheet1"]    # omit to read the first sheet only

# Drive a WaterTAP build -> change_inputs -> solve model and ingest mapped outputs.
# Points come from the model's watertap-mapping.json; registering streams writes
# each point's external reference + Pyomo var (hasExternalReference/hasPyomoVar).
# [[drivers]]
# spec                        = "acquirium.Drivers.BuiltInDrivers.watertap:WaterTAPDriver"
# interval                    = 30.0
# source_id                   = "watertap"
# watertap_mapping_path       = "deployments/WATERTAP/models/seawater-ro/watertap-mapping.json"
# watertap_graph_path         = "deployments/WATERTAP/models/seawater-ro/model.ttl"
# watertap_build_spec         = "deployments/WATERTAP/models/seawater-ro/build-and-solve.py:build"
# watertap_change_inputs_spec = "deployments/WATERTAP/models/seawater-ro/build-and-solve.py:change_inputs"
# watertap_solve_spec         = "deployments/WATERTAP/models/seawater-ro/build-and-solve.py:solve"
# watertap_insert_graph       = true
# watertap_inputs             = { flow_vol = 0.3092, conc_tds = 35.0, conc_tss = 0.03, temperature = 298.0 }
