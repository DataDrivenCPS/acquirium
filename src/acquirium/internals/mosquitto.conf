# Minimal Mosquitto config for local dev
persistence true
persistence_location /mosquitto/data
# Saved on exit and every 60 s, so a broker crash loses at most a minute.
autosave_interval 60

# The broker holds MQTT driver messages until the server accepts them, so these
# limits decide what an outage loses. Per session; queuing stops at the first.
max_queued_messages 1000000
max_queued_bytes 268435456

log_dest file /mosquitto/log/mosquitto.log

listener 1883
allow_anonymous true

# If you want websockets, uncomment and also expose 9001 in compose:
# listener 9001
# protocol websockets
