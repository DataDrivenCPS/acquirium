services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: acquirium_mosquitto
    ports:
    - ${MOSQUITTO_PORT:-1883}:1883
    volumes:
    - mosquitto_data:/mosquitto/data
    - mosquitto_log:/mosquitto/log
    - ./src/acquirium/internals/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
    - acquirium_net
    healthcheck:
      test:
      - CMD-SHELL
      - mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 >/dev/null
        2>&1
      interval: 5s
      timeout: 5s
      retries: 20
  acquirium:
    build:
      context: .
      dockerfile: ./src/acquirium/Dockerfile
      ssh:
      - default
    container_name: acquirium_server
    volumes:
    - acquirium_data:/app/.acquirium
    - ./acquirium.docker.toml:/app/acquirium.toml:ro
    ports:
    - ${ACQUIRIUM_PORT:-8000}:8000
    environment:
      ACQUIRIUM_DATA_DIR: ${ACQUIRIUM_DATA_DIR:-/app/.acquirium}
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-/app/.fastembed_cache}
      ACQUIRIUM_RECREATE: ${ACQUIRIUM_RECREATE:-false}
      ACQUIRIUM_APP_NETWORK: ${ACQUIRIUM_APP_NETWORK:-acquirium_acquirium_net}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - acquirium_net
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 20s
volumes:
  mosquitto_data: null
  mosquitto_log: null
  acquirium_data: null
networks:
  acquirium_net: null
